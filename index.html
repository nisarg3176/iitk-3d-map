<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="labels"></div>

<div id="title" class="ui">
  <h1>IIT Kanpur <span>in 3D</span></h1>
  <p>Made by Nisarg and Parul · <a id="aboutLink" role="button" tabindex="0">About</a></p>
</div>

<div id="searchWrap" class="ui">
  <div id="sbox" class="glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="sq" type="search" placeholder="Search halls, departments, food, roads…" autocomplete="off" spellcheck="false" aria-label="Search places">
    <button id="sclear" aria-label="Clear">×</button>
    <button id="bDir" aria-label="Directions" title="Directions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M9 14v-3h6M13 9l2 2-2 2"/></svg></button>
  </div>
  <div id="results" class="glass"></div>
  <div id="dirPanel" class="glass">
    <div class="dp-head"><b>Directions</b><button id="dClose" aria-label="Close directions">×</button></div>
    <div class="dp-in">
      <div class="dp-dots"><i class="s"></i><span></span><i class="e"></i></div>
      <div class="dp-fields">
        <input id="dFrom" type="search" placeholder="From: choose a place" autocomplete="off" spellcheck="false" aria-label="From">
        <input id="dTo" type="search" placeholder="To: choose a place" autocomplete="off" spellcheck="false" aria-label="To">
      </div>
      <button id="dSwap" aria-label="Swap" title="Swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v15M3.5 15.5L7 19l3.5-3.5M17 20V5M13.5 8.5L17 5l3.5 3.5"/></svg></button>
    </div>
    <div id="dRes"></div>
    <div id="dOut"></div>
  </div>
  <div id="chips"></div>
</div>

<div id="skyPanel" class="ui glass" aria-hidden="true">
  <div class="sp-row">
    <div><div id="spTime">--:--</div><div id="spSun"></div></div>
    <div class="seg"><button id="bLive" class="on">● Live</button></div>
  </div>
  <input id="tslider" type="range" min="0" max="1439" step="1" value="720" aria-label="Time of day">
  <div class="ticks"><span>12 AM</span><span>6 AM</span><span>Noon</span><span>6 PM</span><span>12 AM</span></div>
  <div class="seg" id="quick" style="margin-top:10px">
    <button data-q="sunrise">Sunrise</button><button data-q="noon">Noon</button><button data-q="golden">Golden hour</button><button data-q="sunset">Sunset</button><button data-q="night">Night</button>
  </div>
  <div class="sp-h">Weather</div>
  <div class="seg" id="wx">
    <button data-w="clear" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.4 1.4M17.6 17.6L19 19M3 12h2M19 12h2M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>Clear</button>
    <button data-w="cloudy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/></svg>Cloudy</button>
    <button data-w="fog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>Fog</button>
    <button data-w="rain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>Rain</button>
  </div>
  <div class="sp-h">Season</div>
  <div class="seg" id="season">
    <button data-s="auto" class="on">Auto</button><button data-s="summer">Summer</button><button data-s="monsoon">Monsoon</button><button data-s="autumn">Autumn</button><button data-s="winter">Winter</button>
  </div>
  <label class="tog"><input type="checkbox" id="lifeT" checked><span></span>Traffic, people &amp; birds</label>
</div>

<div id="viewCtl"><div id="viewBtn" class="pill round"><button id="b2D" aria-label="Switch to 2D map" aria-pressed="false" title="Switch between 3D and a flat 2D map"><b id="b2DTxt">2D</b><span id="viewTxt">map</span></button></div>
<div id="lockBtn" class="pill round"><button id="bLock" aria-label="Lock viewing angle" aria-pressed="false" title="Lock viewing angle (zoom and move only)">
  <svg class="lk-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
  <svg class="lk-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <span id="lockTxt">Lock angle</span></button></div></div>
<div id="dock" class="ui">
  <div class="pill">
    <button id="bSky" aria-label="Time, weather and season" title="Time, weather & season">
      <svg id="skyIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span class="tm" id="dockTime">--:--</span><span class="live"></span></button>
  </div>
  <div class="pill round">
    <button id="bWalk" aria-label="Walk mode" title="Walk mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2.5-6.5L14 17v4M7.5 12l2-4.5 3.5-.5 2.5 3.5 3 1M11.5 14.5L13 7"/></svg><span id="walkTxt">Walk</span></button>
  </div>
  <div class="pill round">
    <button id="bLocate" aria-label="Show my location" title="My location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
  </div>
  <div class="pill round">
    <button id="bLabels" class="on" aria-label="Toggle labels" title="Labels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></button>
  </div>
  <div class="pill round">
    <button id="bReset" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
  </div>
</div>
<div id="card" class="ui glass" role="dialog" aria-label="Place details"></div>
<div id="layPop" class="ui glass"><div class="lp-h"><span>Useful spots</span><button id="lpX" aria-label="Close">×</button></div><div class="lp-grid" id="lpGrid"></div><div id="lpList"></div></div>
<div id="me"></div>
<div id="guide"><div class="g-top"><i id="gIc"></i><div class="g-txt"><b id="gTxt"></b><small id="gNext"></small></div></div>
  <div class="g-bar"><span id="gRem"></span><button id="gPause" aria-label="Pause">❚❚</button><button id="gStop">End</button></div></div>
<div id="hint" class="ui">Drag to move · pinch to zoom · two fingers to rotate</div>
<div id="joy" class="ui glass"><i></i></div>
<div id="cross"></div>
<div id="flash"></div>

<div id="loader"><h2>IIT Kanpur</h2><p id="lmsg">Laying out the roads…</p><div class="bar"><i></i></div></div>

<script type="module" src="js/main.js?v=20261128a"></script>
</body>
</html>
