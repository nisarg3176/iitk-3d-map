<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>IIT Kanpur in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --glass: rgba(255,255,255,.78);
    --glass-b: rgba(255,255,255,.9);
    --ink:#1d2a24; --ink2:#55645c; --accent:#0f6b5c; --gold:#e9b44c;
    --lbl-bg: rgba(255,255,255,.88); --lbl-ink:#23302a; --lbl-b: rgba(0,0,0,.06);
  }
  body.night{
    --glass: rgba(18,24,40,.72); --glass-b: rgba(255,255,255,.12);
    --ink:#eef2ff; --ink2:#a9b3cc; --accent:#f2c46d;
    --lbl-bg: rgba(16,22,38,.78); --lbl-ink:#f4ead2; --lbl-b: rgba(255,214,140,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ee;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
  body.night{background:#0a1020}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 12px/1 Outfit,sans-serif;
    padding:6px 10px;border-radius:999px;background:var(--lbl-bg);color:var(--lbl-ink);
    border:1px solid var(--lbl-b);box-shadow:0 2px 10px rgba(0,0,0,.12);
    transform:translate(-9999px,0);opacity:0;transition:opacity .25s;will-change:transform;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lbl.show{opacity:1}
  .lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .lbl.t1{font-weight:600;font-size:13px;padding:7px 12px 7px 10px}
  .lbl.t1 i{width:8px;height:8px;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
  body.night .lbl.t1 i{box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .lbl.t3{font-size:11px;padding:5px 9px}
  .lbl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:7px;margin-left:-1px;background:var(--lbl-bg);border-radius:0 0 2px 2px}
  .lbl.lane{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:2px 4px;
    font:600 10.5px/1 Outfit,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#4c5a52;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px rgba(255,255,255,.9)}
  body.night .lbl.lane{color:#c9d2e6;text-shadow:0 0 3px #0b1222,0 0 6px #0b1222}
  .lbl.lane::after,.lbl.hn::after,.lbl.poi::after{display:none}
  .lbl.hn{font:600 10px/1 Outfit,sans-serif;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.92);color:#3b4a42}
  body.night .lbl.hn{background:rgba(16,22,38,.85);color:#e8dcc0}
  .lbl.poi{width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;font:700 9px/1 Outfit,sans-serif}
  .lbl.poi svg{width:13px;height:13px}
  .lbl.feat{font-weight:700}
  .lbl.feat b{display:inline-flex;align-items:center;margin-right:5px;vertical-align:-2px;color:#e0262f}
  .lbl.feat b svg{width:13px;height:13px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 55%,rgba(28,40,24,.26) 100%);transition:background .8s}
  body.night #vig{background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 45%,rgba(2,4,12,.55) 100%)}
  body.hide-labels #labels{display:none}

  .ui{position:fixed;z-index:5}
  #title{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    padding:12px 16px 11px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.12);transition:background .6s,color .6s}
  #title h1{margin:0;font:700 22px/1.05 "Josefin Sans",sans-serif;letter-spacing:.2px}
  #title h1 span{color:var(--gold)}
  #title p{margin:5px 0 0;font-size:12px;color:var(--ink2)}

  #dock{left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
  .pill{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.15);transition:background .6s}
  .pill button{appearance:none;border:0;background:transparent;color:var(--ink);font:500 14px Outfit,sans-serif;
    padding:9px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .3s,color .3s}
  .pill button{white-space:nowrap}
  .pill button.on{background:var(--accent);color:#fff}
  body.night .pill button.on{color:#1a1406}
  .pill button svg{width:16px;height:16px}
  .round button{padding:9px 12px}

  #hint{left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));font-size:12.5px;
    padding:8px 14px;border-radius:999px;background:var(--glass);color:var(--ink2);border:1px solid var(--glass-b);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .8s;white-space:nowrap}
  #hint.gone{opacity:0;pointer-events:none}

  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 40%,#e9f3e0 0%,#bcd9a5 100%);transition:opacity .9s}
  #loader.done{opacity:0;pointer-events:none}
  #loader h2{margin:0;font:700 30px "Josefin Sans",sans-serif;color:#24402f}
  #loader p{margin:0;font-size:14px;color:#4c6a55}
  .bar{width:180px;height:4px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:30%;background:#2f7d5b;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  .glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.15);transition:background .6s,color .6s}
  #bSky .tm{font-variant-numeric:tabular-nums;font-weight:600}
  #bSky .live{width:7px;height:7px;border-radius:50%;background:#e0464b;box-shadow:0 0 0 0 rgba(224,70,75,.6);animation:lv 2s infinite;display:none}
  #bSky.islive .live{display:inline-block}
  @keyframes lv{0%{box-shadow:0 0 0 0 rgba(224,70,75,.55)}70%{box-shadow:0 0 0 7px rgba(224,70,75,0)}100%{box-shadow:0 0 0 0 rgba(224,70,75,0)}}
  #skyPanel{left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);width:min(440px,calc(100vw - 20px));
    border-radius:20px;padding:14px 16px 12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s,background .6s}
  #skyPanel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-h{font:600 11px Outfit;letter-spacing:.9px;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
  #spTime{font:700 26px/1 "Josefin Sans",sans-serif;font-variant-numeric:tabular-nums}
  #spSun{font-size:12px;color:var(--ink2);margin-top:3px}
  #tslider{width:100%;margin:12px 0 2px;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;outline:none;
    background:linear-gradient(90deg,#0d1530 0%,#1d2a55 20%,#f39a63 27%,#7fb4e2 36%,#5d9fd6 50%,#7fb4e2 64%,#f39a63 72%,#1d2a55 80%,#0d1530 100%)}
  #tslider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab}
  #tslider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab}
  .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);padding:0 2px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button,.chip{appearance:none;border:1px solid var(--glass-b);background:rgba(127,127,127,.1);color:var(--ink);font:500 13px Outfit,sans-serif;
    padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s;white-space:nowrap}
  .seg button svg{width:15px;height:15px}
  .seg button.on,.chip.on{background:var(--accent);color:#fff;border-color:transparent}
  body.night .seg button.on,body.night .chip.on{color:#1a1406}
  #bLive.on{background:#e0464b;color:#fff}
  .tog{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;cursor:pointer;user-select:none}
  .tog input{display:none} .tog span{width:34px;height:20px;border-radius:20px;background:rgba(127,127,127,.35);position:relative;transition:background .2s}
  .tog span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
  .tog input:checked+span{background:var(--accent)} .tog input:checked+span::after{transform:translateX(14px)}

  #searchWrap{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:380px}
  #sbox{display:flex;align-items:center;gap:8px;border-radius:16px;padding:0 8px 0 14px;height:46px}
  #sbox svg{width:18px;height:18px;flex:none;color:var(--ink2)}
  #sq{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 15px Outfit,sans-serif;height:100%}
  #sq::placeholder{color:var(--ink2)}
  #sclear{border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:6px;display:none;font-size:18px;line-height:1}
  #results{margin-top:6px;border-radius:16px;overflow:hidden;display:none;max-height:min(360px,50vh);overflow-y:auto}
  #results.open{display:block}
  .res{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:14px}
  .res i{width:9px;height:9px;border-radius:50%;flex:none}
  .res small{margin-left:auto;color:var(--ink2);font-size:11.5px;white-space:nowrap}
  .res.sel,.res:hover{background:rgba(127,127,127,.16)}
  .res b{font-weight:700;color:var(--accent)}
  .nores{padding:12px 14px;font-size:13px;color:var(--ink2)}
  #chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-end}
  .chip{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 3px 12px rgba(0,0,0,.1);font-size:12.5px;padding:6px 11px}
  .chip i{width:8px;height:8px;border-radius:50%}
  .chip.on i{box-shadow:0 0 0 2px rgba(255,255,255,.7)}

  #joy{left:calc(26px + env(safe-area-inset-left));bottom:calc(100px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;display:none;touch-action:none}
  #joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 12px rgba(0,0,0,.25)}
  body.night #joy i{background:rgba(242,196,109,.85)}
  body.walking.touch #joy{display:block}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.25);display:none;pointer-events:none;z-index:4}
  body.walking #cross{display:block}
  body.walking #vig{background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.22) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:3}

  @media (max-width:720px){
    #searchWrap{left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));width:auto;top:calc(82px + env(safe-area-inset-top))}
    #sbox{height:42px}
    #chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:8px -12px 0;padding:0 12px 6px;scrollbar-width:none}
    #chips::-webkit-scrollbar{display:none}
    #title{padding:10px 14px 9px}
  }
  @media (max-width:520px){
    #title h1{font-size:19px} #title p{font-size:11px}
    .pill button{padding:9px 13px;font-size:13px}
    .round button{padding:9px 11px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="labels"></div>

<div id="title" class="ui">
  <h1>IIT Kanpur <span>in 3D</span></h1>
  <p>OpenStreetMap data</p>
</div>

<div id="searchWrap" class="ui">
  <div id="sbox" class="glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="sq" type="search" placeholder="Search halls, departments, food, roads…" autocomplete="off" spellcheck="false" aria-label="Search places">
    <button id="sclear" aria-label="Clear">×</button>
  </div>
  <div id="results" class="glass"></div>
  <div id="chips"></div>
</div>

<div id="skyPanel" class="ui glass" aria-hidden="true">
  <div class="sp-row">
    <div><div id="spTime">--:--</div><div id="spSun"></div></div>
    <div class="seg"><button id="bLive" class="on">● Live</button></div>
  </div>
  <input id="tslider" type="range" min="0" max="1439" step="1" value="720" aria-label="Time of day">
  <div class="ticks"><span>12 AM</span><span>6 AM</span><span>Noon</span><span>6 PM</span><span>12 AM</span></div>
  <div class="seg" id="quick" style="margin-top:10px">
    <button data-q="sunrise">Sunrise</button><button data-q="noon">Noon</button><button data-q="golden">Golden hour</button><button data-q="sunset">Sunset</button><button data-q="night">Night</button>
  </div>
  <div class="sp-h">Weather</div>
  <div class="seg" id="wx">
    <button data-w="clear" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.4 1.4M17.6 17.6L19 19M3 12h2M19 12h2M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>Clear</button>
    <button data-w="cloudy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/></svg>Cloudy</button>
    <button data-w="fog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>Fog</button>
    <button data-w="rain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>Rain</button>
  </div>
  <div class="sp-h">Season</div>
  <div class="seg" id="season">
    <button data-s="auto" class="on">Auto</button><button data-s="summer">Summer</button><button data-s="monsoon">Monsoon</button><button data-s="autumn">Autumn</button><button data-s="winter">Winter</button>
  </div>
  <label class="tog"><input type="checkbox" id="lifeT" checked><span></span>Traffic, people &amp; birds</label>
</div>

<div id="dock" class="ui">
  <div class="pill">
    <button id="bSky" aria-label="Time, weather and season" title="Time, weather & season">
      <svg id="skyIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span class="tm" id="dockTime">--:--</span><span class="live"></span></button>
  </div>
  <div class="pill round">
    <button id="bWalk" aria-label="Walk mode" title="Walk mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2.5-6.5L14 17v4M7.5 12l2-4.5 3.5-.5 2.5 3.5 3 1M11.5 14.5L13 7"/></svg><span id="walkTxt">Walk</span></button>
  </div>
  <div class="pill round">
    <button id="bLabels" class="on" aria-label="Toggle labels" title="Labels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></button>
  </div>
  <div class="pill round">
    <button id="bReset" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
  </div>
</div>
<div id="hint" class="ui">Drag to move · pinch to zoom · two fingers to rotate</div>
<div id="joy" class="ui glass"><i></i></div>
<div id="cross"></div>
<div id="flash"></div>

<div id="loader"><h2>IIT Kanpur</h2><p id="lmsg">Laying out the roads…</p><div class="bar"><i></i></div></div>

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const lmsg = document.getElementById('lmsg');
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------------- helpers ---------------- */
function rng(seed){ const f=function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; f.st=()=>seed; f.set=v=>{seed=v;}; return f; }
const R = rng(20261121);
const rr = (a,b)=>a+(b-a)*R();
function hash2(x,y){ let h = Math.imul(x|0,374761393) + Math.imul(y|0,668265263); h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return vnoise(x,y)*.55+vnoise(x*2.1+7,y*2.1+3)*.3+vnoise(x*4.3+1,y*4.3+9)*.15; }
const C = h => new THREE.Color(h);
const isCoarse = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth,innerHeight) < 600;

class Geo { // non-indexed geometry builder
  constructor(){ this.p=[]; this.n=[]; this.c=[]; this.uv=[]; }
  v(x,y,z,nx,ny,nz,col,u,vv){ this.p.push(x,y,z); this.n.push(nx,ny,nz); if(col) this.c.push(col.r,col.g,col.b); if(u!==undefined) this.uv.push(u,vv); }
  tri(ax,ay,az,bx,by,bz,cx,cy,cz,col){ // auto-orient so normal points up-ish
    let ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    if(ny<0){ [bx,by,bz,cx,cy,cz]=[cx,cy,cz,bx,by,bz]; nx=-nx;ny=-ny;nz=-nz; }
    const l=Math.hypot(nx,ny,nz)||1; nx/=l;ny/=l;nz/=l;
    this.v(ax,ay,az,nx,ny,nz,col); this.v(bx,by,bz,nx,ny,nz,col); this.v(cx,cy,cz,nx,ny,nz,col);
  }

function setFocus(l){ focusLbl=l; marker.visible=!!l; if(l){ const s=Math.max(14,Math.min(60,(l.size||20)*.75)); marker.position.set(l.x,.55,l.z); marker.userData.s=s; marker.userData.beam.scale.set(s*.6,l.y+40,s*.6); marker.userData.t0=performance.now(); } kick(); }
function pick(it){ const l=it.l; sq.value=l.name; closeResults(); sq.blur(); sclear.style.display='block';
  if(wk.on) exitWalk(true);
  if(catFilter && l.cat!==catFilter) setCat('all');
  setFocus(l);
  const dist=l.kind==='lane'?420:THREE.MathUtils.clamp((l.size||30)*3.2+170,220,620);
  const off=HOME_OFF.clone().normalize().multiplyScalar(dist);
  flyTo(new THREE.Vector3(l.x,0,l.z),off,1900); idleT=performance.now();
}
// category chips
const CHIPS=[['all','All'],['academic','Academic'],['hostel','Hostels'],['food','Food'],['shop','Shops'],['sports','Sports'],['health','Health'],['worship','Worship']];
const chipsEl=document.getElementById('chips');
chipsEl.innerHTML=CHIPS.map(([k,n])=>`<button class="chip${k==='all'?' on':''}" data-c="${k}">${k==='all'?'':`<i style="background:${CATCOL[k]}"></i>`}${n}</button>`).join('');
let catAnim=null;
function setCat(c,doFly=true){
  catFilter=c==='all'?null:c; [...chipsEl.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  if(catFilter){ CATU.uCat.value=CATS.indexOf(catFilter); CATU.uCatCol.value.set(CATCOL[catFilter]); }
  catAnim={from:CATU.uCatAmt.value,to:catFilter?1:0,t0:performance.now()};
  if(catFilter&&doFly){ const pts=labels.filter(l=>!l.kind&&l.cat===catFilter);
    if(pts.length){ let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9; for(const l of pts){ mnx=Math.min(mnx,l.x);mxx=Math.max(mxx,l.x);mnz=Math.min(mnz,l.z);mxz=Math.max(mxz,l.z); }
      const span=Math.max(mxx-mnx,mxz-mnz); const T=new THREE.Vector3((mnx+mxx)/2,0,(mnz+mxz)/2);
      if(wk.on) exitWalk(true);
      flyTo(T,HOME_OFF.clone().normalize().multiplyScalar(THREE.MathUtils.clamp(span*1.25+350,450,2900)),1800); } }
  kick();
}
chipsEl.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const c=b.dataset.c; setCat(c===catFilter?'all':c); });

/* ================= SKY PANEL UI ================= */
const panel=document.getElementById('skyPanel'), slider=document.getElementById('tslider');
const ICO={sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>', cloud:'<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/>',
  fog:'<path d="M4 9h16M3 13h18M5 17h14"/>', rain:'<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  rise:'<path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 4v4M5.5 9.5l1.5 1.5M18.5 9.5L17 11"/>'};
function closePanel(){ panel.classList.remove('open'); }
document.getElementById('bSky').onclick=e=>{ e.stopPropagation(); panel.classList.toggle('open'); closeResults(); };
function updateTimeUI(){
  const p=istParts(simMs), ev=dayEvents(istDay0(simMs));
  if(document.activeElement!==slider) slider.value=Math.round(p.min);
  const t=fmt(p.min); document.getElementById('spTime').textContent=t; document.getElementById('dockTime').textContent=t;
  document.getElementById('spSun').textContent=`Sunrise ${fmt(ev.rise)} · Sunset ${fmt(ev.set)}`+(seasonMode==='auto'?` · ${curSeason()[0].toUpperCase()+curSeason().slice(1)}`:'');
  document.getElementById('bSky').classList.toggle('islive',live); document.getElementById('bLive').classList.toggle('on',live);
  const ic = weather==='rain'?'rain':weather==='fog'?'fog':weather==='cloudy'?'cloud':sunAlt<-3?'moon':sunAlt<6?'rise':'sun';
  const ico=document.getElementById('skyIco'); if(ico.dataset.k!==ic){ ico.innerHTML=ICO[ic]; ico.dataset.k=ic; }
}
function goTime(targetMin,dur=2600){ live=false; const d0=istDay0(simMs), cur=istParts(simMs).min; let to=targetMin; if(to<cur-1) to+=1440;
  timeAnim={from:d0+cur*60000,to:d0+to*60000,t0:performance.now(),dur:Math.min(dur,600+Math.abs(to-cur)*6)}; }
slider.addEventListener('input',()=>{ live=false; timeAnim=null; simMs=istDay0(simMs)+(+slider.value)*60000; atmosDirty=true; });
document.getElementById('bLive').onclick=()=>{ timeAnim=null; const target=Date.now(); timeAnim={from:simMs,to:target,t0:performance.now(),dur:1500,goLive:true}; };
document.getElementById('quick').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const ev=dayEvents(istDay0(simMs));
  goTime({sunrise:ev.rise+8,noon:ev.noon,golden:ev.set-50,sunset:ev.set-6,night:21*60+30}[b.dataset.q]); });
document.getElementById('wx').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; weather=b.dataset.w;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b)); atmosDirty=true; });
document.getElementById('season').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; seasonMode=b.dataset.s;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b)); atmosDirty=true; });
document.getElementById('lifeT').onchange=e=>{ LIFE.on=e.target.checked; kick(); };
document.getElementById('bLabels').onclick=e=>{ labelsOn=!labelsOn; document.body.classList.toggle('hide-labels',!labelsOn); e.currentTarget.classList.toggle('on',labelsOn); kick(); };
let fly=null;
function flyTo(t,off,dur=1800){ fly={t0:performance.now(),dur,fromP:camera.position.clone(),fromT:controls.target.clone(),toT:t.clone(),toP:t.clone().add(off)}; kick(); }
document.getElementById('bReset').onclick=()=>{ if(wk.on) exitWalk(true); setCat('all',false); flyTo(HOME_T,HOME_OFF); };

/* ---------------- loop ---------------- */
let dirty=true, idleT=performance.now(), atmosDirty=true, shadowDirty=true, camDist=1000;
function kick(){ dirty=true; }
controls.addEventListener('change',kick);
controls.addEventListener('start',()=>{ fly=null; controls.autoRotate=false; idleT=performance.now(); hideHint(); });
controls.addEventListener('end',()=>{ idleT=performance.now(); });
let hintTimer=setTimeout(hideHint,7000);
function hideHint(){ hintEl.classList.add('gone'); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); labels.forEach(l=>l.w=0); kick(); });

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function clampTarget(){ const t=controls.target, lim=EXT-150; const cx=THREE.MathUtils.clamp(t.x,-lim,lim), cz=THREE.MathUtils.clamp(t.z,-lim,lim);
  if(cx!==t.x||cz!==t.z){ camera.position.x+=cx-t.x; camera.position.z+=cz-t.z; t.x=cx; t.z=cz; } t.y=0; }
function updateSun(){
  const d=wk.on?22:camera.position.distanceTo(controls.target); camDist=d;
  const s=THREE.MathUtils.clamp(d*0.95,wk.on?110:160,1700);
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).addScaledVector(LIGHT_DIR,2400);
  const cam=sun.shadow.camera; cam.left=-s;cam.right=s;cam.top=s;cam.bottom=-s; cam.near=100; cam.far=4800; cam.updateProjectionMatrix();
  const fk=wxCur.fogK;
  scene.fog.near=(d*0.8+150)*fk; scene.fog.far=(d*2.2+1250)*(0.35+0.65*fk)*(fk<0.5?0.55+fk:1);
  lampGlow.material.size = THREE.MathUtils.clamp(d/110,4,11);
}
let last=performance.now(), lastRender=0, liveT=0;
const FRAME_MS=isCoarse?32:0;
function frame(now){
  requestAnimationFrame(frame);
  if(now-lastRender<FRAME_MS && !dirty) return;
  const dt=Math.min(0.1,(now-last)/1000); last=now; const t=now/1000; TIME.value=t;
  if(timeAnim){ const k=Math.min(1,(now-timeAnim.t0)/timeAnim.dur); simMs=timeAnim.from+(timeAnim.to-timeAnim.from)*ease(k); atmosDirty=true;
    if(k>=1){ if(timeAnim.goLive){ live=true; simMs=Date.now(); } timeAnim=null; } }
  else if(live && now-liveT>20000){ simMs=Date.now(); liveT=now; atmosDirty=true; }
  if(stepWx(dt)) atmosDirty=true; stepSeason(dt);
  if(catAnim){ const k=Math.min(1,(now-catAnim.t0)/500); CATU.uCatAmt.value=catAnim.from+(catAnim.to-catAnim.from)*ease(k); if(k>=1) catAnim=null; dirty=true; }
  if(atmosDirty){ atmosDirty=false; applyAtmos(); dirty=true; }
  if(fly){ const k=Math.min(1,(now-fly.t0)/fly.dur), e=ease(k);
    controls.target.lerpVectors(fly.fromT,fly.toT,e); camera.position.lerpVectors(fly.fromP,fly.toP,e); dirty=true; if(k>=1) fly=null; }
  if(wk.on){ stepWalk(dt,now); dirty=true; }
  else {
    if(!controls.autoRotate && !fly && !focusLbl && !catFilter && now-idleT>30000){ controls.autoRotate=true; controls.autoRotateSpeed=0.25; }
    controls.update(); if(controls.autoRotate) dirty=true;
    clampTarget();
  }
  if(dirty) shadowDirty=true;
  updateSun();
  if(shadowDirty){ renderer.shadowMap.needsUpdate=true; shadowDirty=false; }
  // ambient animation
  CLU.uDrift.value=t*4.5; CLU.uN.value=wxCur.clouds; clouds.visible=wxCur.clouds>0.3;
  rainLines.visible=wxCur.rain>0.02; if(rainLines.visible){ const ru=rainMat.uniforms; ru.uA.value=wxCur.rain*.42;
    const near=wk.on; ru.uB.value.set(near?70:240,near?50:200,near?70:240);
    const f=new THREE.Vector3(); camera.getWorldDirection(f); ru.uO.value.copy(camera.position).addScaledVector(f,near?20:110); }
  stepLife(dt,t);
  if(marker.visible){ const s=marker.userData.s, k=((now-marker.userData.t0)/1400)%1; marker.children[0].scale.setScalar(s*(1+k*.35)); marker.children[1].scale.setScalar(s*.9); mkMat.opacity=.9*(1-k*.6); }
  sky.position.copy(camera.position); refreshEnv(now);
  if(bloom.strength>0.01) composer.render(); else renderer.render(scene,camera);
  updateLabels();
  dirty=false; lastRender=now;
}
renderer.shadowMap.autoUpdate=false;
applyAtmos();
document.getElementById('loader').classList.add('done');
requestAnimationFrame(frame);
flyTo(HOME_T,HOME_OFF,3200);
window.__ready=true;
window.__api={flyTo,camera,controls,THREE,kick,scene,sky,clouds,skyU,agents,lifeM,carNet,enterWalk,exitWalk,setCat,wk,labels,
  setTime:(h)=>{ live=false; timeAnim=null; simMs=istDay0(simMs)+h*3600000; atmosDirty=true; },
  setWeather:(w)=>{ weather=w; Object.assign(wxCur,{...WX[w],gc:C(WX[w].gc),cc:C(WX[w].cc)}); atmosDirty=true; },
  setSeason:(s)=>{ seasonMode=s; const S=SEASONS[curSeason()]; SEA.grassMul.value.set(...S.gm); SEA.leafMul.value.set(...S.lm); SEA.dry.value=S.dry; SEA.turn.value=S.turn; SEA.bloom.value=S.bloom; SEA.turnA.value.set(S.ta); SEA.turnB.value.set(S.tb); atmosDirty=true; },
  search:(q)=>{ sq.value=q; renderResults(); if(resList[0]) pick(resList[0]); },
  setView:(t,off)=>{ fly=null; controls.target.copy(t); camera.position.copy(t).add(off); controls.update(); kick(); }};
</script>
